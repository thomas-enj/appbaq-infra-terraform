name: Terraform - Test, Plan, Apply & Destroy

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TERRAFORM_VERSION: 1.9.0
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  RGROUP: ${{ vars.TF_RGROUP }}
  SA_BACKEND: ${{ vars.TF_SA_BACKEND }}
  OWNER: ${{ vars.TF_OWNER }}
  TF_VAR_owner: ${{ vars.TF_OWNER }}
  TF_VAR_resource_group_name: ${{ vars.TF_RGROUP }}
  AKS_RESOURCE_GROUP_NAME: ${{ vars.TF_SHARED_AKS_RESOURCE_GROUP_NAME || 'rg-shared-prf2026' }}
  AKS_CLUSTER_NAME: ${{ vars.TF_SHARED_AKS_CLUSTER_NAME || 'aks-nonprod-prf2026' }}
  TF_VAR_frontend_ci_kv_reader_object_ids: ${{ secrets.TF_FRONTEND_CI_KV_READER_OBJECT_IDS || '[]' }}

jobs:
  tflint:
    name: Terraform Linting
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.52.0

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint -f compact

  checkov:
    name: Security Scan (Checkov)
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform
          # Output to console for detailed log review and generate a SARIF file to capture severity levels
          output_format: cli,sarif
          # Map outputs respectively: 'cli' to stdout, 'sarif' to the specified file
          output_file_path: console,checkov_report.sarif
          # Ensure pipeline continues executing to allow reporting even if policy violations occur
          soft_fail: true

  gitleaks:
    name: Secret Scan (Gitleaks)
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  discover-aks-vnet:
    name: Discover shared AKS VNet
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    outputs:
      vnet_resource_group: ${{ steps.discover.outputs.vnet_resource_group }}
      vnet_name: ${{ steps.discover.outputs.vnet_name }}
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Az CLI login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${RGROUP}" \
            -backend-config="storage_account_name=${SA_BACKEND}" \
            -backend-config="container_name=tfstate-appbaq" \
            -backend-config="key=${OWNER}.terraform.tfstate" \
            -migrate-state

      - name: Read shared AKS VNet
        id: discover
        shell: bash
        run: |
          vnet_id=$(terraform state show -no-color \
            module.aks_integration.azurerm_virtual_network_peering.db_to_aks 2>/dev/null \
            | sed -n 's/^[[:space:]]*remote_virtual_network_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' || true)

          if [ -z "$vnet_id" ]; then
            subnet_id=$(az aks show \
              --resource-group "$AKS_RESOURCE_GROUP_NAME" \
              --name "$AKS_CLUSTER_NAME" \
              --query "networkProfile.vnetSubnetId" \
              --output tsv || true)

            if [ -z "$subnet_id" ]; then
              subnet_id=$(az aks show \
                --resource-group "$AKS_RESOURCE_GROUP_NAME" \
                --name "$AKS_CLUSTER_NAME" \
              --query "agentPoolProfiles[?vnetSubnetId != null && vnetSubnetId != ''] | [0].vnetSubnetId" \
                --output tsv || true)
            fi

            if [ -z "$subnet_id" ]; then
              node_resource_group=$(az aks show \
                --resource-group "$AKS_RESOURCE_GROUP_NAME" \
                --name "$AKS_CLUSTER_NAME" \
                --query nodeResourceGroup \
                --output tsv || true)

              vnet_id=$(az network vnet list \
                --resource-group "$node_resource_group" \
                --query "[0].id" \
                --output tsv || true)
            else
              vnet_id="${subnet_id%/subnets/*}"
            fi
          fi

          if [ -z "$vnet_id" ] && [ -n "$node_resource_group" ]; then
            subnet_id=$(az vmss list \
              --resource-group "$node_resource_group" \
              --query "[].virtualMachineProfile.networkProfile.networkInterfaceConfigurations[].ipConfigurations[].subnet.id | [0]" \
              --output tsv || true)
            if [ -n "$subnet_id" ]; then
              vnet_id="${subnet_id%/subnets/*}"
            fi
          fi

          if [ -z "$vnet_id" ]; then
            echo "Unable to discover the shared AKS VNet from agent pools, the node resource group, or node NICs." >&2
            az aks show \
              --resource-group "$AKS_RESOURCE_GROUP_NAME" \
              --name "$AKS_CLUSTER_NAME" \
              --query "{nodeResourceGroup:nodeResourceGroup,networkProfile:networkProfile}" \
              --output json >&2 || true
            exit 1
          fi

          vnet_resource_group=$(echo "$vnet_id" | sed -n 's#^/subscriptions/[^/]*/resourceGroups/\([^/]*\)/providers/Microsoft.Network/virtualNetworks/[^/]*$#\1#p')
          vnet_name=$(echo "$vnet_id" | sed -n 's#^/subscriptions/[^/]*/resourceGroups/[^/]*/providers/Microsoft.Network/virtualNetworks/\([^/]*\)$#\1#p')

          if [ -z "$vnet_resource_group" ] || [ -z "$vnet_name" ]; then
            echo "Discovered value is not a valid Azure VNet resource ID: $vnet_id" >&2
            exit 1
          fi

          echo "vnet_resource_group=$vnet_resource_group" >> "$GITHUB_OUTPUT"
          echo "vnet_name=$vnet_name" >> "$GITHUB_OUTPUT"

  tftest:
    name: Terraform Test
    needs: [tflint, checkov, gitleaks, discover-aks-vnet]
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Set AKS VNet Terraform variable
        shell: bash
        run: echo "TF_VAR_shared_aks_vnet_id=/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/${{ needs.discover-aks-vnet.outputs.vnet_resource_group }}/providers/Microsoft.Network/virtualNetworks/${{ needs.discover-aks-vnet.outputs.vnet_name }}" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${RGROUP}" \
            -backend-config="storage_account_name=${SA_BACKEND}" \
            -backend-config="container_name=tfstate-appbaq" \
            -backend-config="key=${OWNER}.terraform.tfstate" \
            -migrate-state

      - name: Terraform Test
        run: terraform test
  
  plan:
    name: Terraform Plan
    needs: [tftest, discover-aks-vnet]
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Set AKS VNet Terraform variable
        shell: bash
        run: echo "TF_VAR_shared_aks_vnet_id=/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/${{ needs.discover-aks-vnet.outputs.vnet_resource_group }}/providers/Microsoft.Network/virtualNetworks/${{ needs.discover-aks-vnet.outputs.vnet_name }}" >> "$GITHUB_ENV"

      - name: Az CLI login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="resource_group_name=${RGROUP}" \
            -backend-config="storage_account_name=${SA_BACKEND}" \
            -backend-config="container_name=tfstate-appbaq" \
            -backend-config="key=${OWNER}.terraform.tfstate" \
            -migrate-state

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          # The plan is launched with the colors (for CI logs) and saved
          terraform plan -out=tfplan
          
          # The result is displayed in black text for the comment
          PLAN_TEXT=$(terraform show -no-color tfplan)
          
          # Required syntax to safely pass a multi-line string to GITHUB_OUTPUT
          delimiter="$(openssl rand -hex 8)"
          echo "clean_plan<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$PLAN_TEXT" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Structure of the body of the commentary
            const output = `### Terraform result 🚀
            #### Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Plan 📖 \`${{ steps.plan.outcome }}\`
            
            <details><summary>Display Plan Details</summary>
            
            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`
            
            </details>
            
            *Triggered by : @${{ github.actor }}, Event : \`${{ github.event_name }}\`*`;
            
            // Publication of the commentary
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
  apply:
    name: Terraform Apply
    needs: [plan, discover-aks-vnet]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: tf-apply
    defaults:
        run:
            working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Set AKS VNet Terraform variable
        shell: bash
        run: echo "TF_VAR_shared_aks_vnet_id=/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/${{ needs.discover-aks-vnet.outputs.vnet_resource_group }}/providers/Microsoft.Network/virtualNetworks/${{ needs.discover-aks-vnet.outputs.vnet_name }}" >> "$GITHUB_ENV"

      - name: Az CLI login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${RGROUP}" \
            -backend-config="storage_account_name=${SA_BACKEND}" \
            -backend-config="container_name=tfstate-appbaq" \
            -backend-config="key=${OWNER}.terraform.tfstate" \
            -migrate-state

      - name: Terraform Apply
        run: terraform apply -auto-approve

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: tf-destroy
    defaults:
        run:
            working-directory: ./terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Az CLI login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${RGROUP}" \
            -backend-config="storage_account_name=${SA_BACKEND}" \
            -backend-config="container_name=tfstate-appbaq" \
            -backend-config="key=${OWNER}.terraform.tfstate" \
            -migrate-state

      - name: Restore AKS VNet from state
        shell: bash
        run: |
          vnet_id=$(terraform state show -no-color \
            module.aks_integration.azurerm_virtual_network_peering.db_to_aks 2>/dev/null \
            | sed -n 's/^[[:space:]]*remote_virtual_network_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p')

          if [ -z "$vnet_id" ]; then
            echo "The AKS VNet ID is not available in state; discovering it from Azure."
            subnet_id=$(az aks show \
              --resource-group "$AKS_RESOURCE_GROUP_NAME" \
              --name "$AKS_CLUSTER_NAME" \
              --query "agentPoolProfiles[?vnetSubnetId != null && vnetSubnetId != ''] | [0].vnetSubnetId" \
              --output tsv)

            if [ -z "$subnet_id" ]; then
              node_resource_group=$(az aks show \
                --resource-group "$AKS_RESOURCE_GROUP_NAME" \
                --name "$AKS_CLUSTER_NAME" \
                --query nodeResourceGroup \
                --output tsv)
              vnet_id=$(az network vnet list \
                --resource-group "$node_resource_group" \
                --query "[0].id" \
                --output tsv)
            else
              vnet_id="${subnet_id%/subnets/*}"
            fi
          fi

          if [ -z "$vnet_id" ]; then
            echo "Unable to determine the AKS VNet ID required to load the Terraform configuration." >&2
            exit 1
          fi

          echo "TF_VAR_shared_aks_vnet_id=$vnet_id" >> "$GITHUB_ENV"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve